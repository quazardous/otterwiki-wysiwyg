name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Round-trip tests
        run: npm test
        working-directory: frontend
      - name: The committed bundle matches the sources
        run: |
          npm run build
          git diff --exit-code -- ../otterwiki_wysiwyg/static
        working-directory: frontend
      - name: Start a wiki with the plugin
        run: |
          docker compose up -d
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done
          make seed
      - name: End-to-end tests (system Chrome)
        run: CHROME=$(command -v google-chrome) npm run e2e
        working-directory: frontend
      - name: Wiki logs
        if: failure()
        run: docker compose logs otterwiki
